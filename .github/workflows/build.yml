name: Build & Package

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore src/PoeToolkit/PoeToolkit.csproj

      - name: Build
        run: dotnet build src/PoeToolkit/PoeToolkit.csproj -c Release --no-restore

      - name: Publish portable exe
        run: dotnet publish src/PoeToolkit/PoeToolkit.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --no-restore

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PoeToolkit-win-x64
          path: src/PoeToolkit/bin/Release/net8.0-windows/win-x64/publish/PoeToolkit.exe
          compression-level: 9
