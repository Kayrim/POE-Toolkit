name: Build & Release

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Determine version
        id: version
        shell: bash
        run: |
          # Get latest tag, default to v0.0.0 if none
          LATEST=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)
          if [ -z "$LATEST" ]; then
            LATEST="v0.0.0"
          fi
          # Parse and increment patch
          MAJOR=$(echo "$LATEST" | cut -d. -f1 | tr -d 'v')
          MINOR=$(echo "$LATEST" | cut -d. -f2)
          PATCH=$(echo "$LATEST" | cut -d. -f3)
          PATCH=$((PATCH + 1))
          NEW_VERSION="v${MAJOR}.${MINOR}.${PATCH}"
          ASSEMBLY_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "assembly_version=$ASSEMBLY_VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $NEW_VERSION"

      - name: Restore dependencies
        run: dotnet restore src/PoeToolkit/PoeToolkit.csproj

      - name: Build
        run: dotnet build src/PoeToolkit/PoeToolkit.csproj -c Release --no-restore -p:Version=${{ steps.version.outputs.assembly_version }}

      - name: Publish portable exe
        run: dotnet publish src/PoeToolkit/PoeToolkit.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --no-restore -p:Version=${{ steps.version.outputs.assembly_version }}

      - name: Zip artifact
        shell: pwsh
        run: Compress-Archive -Path src/PoeToolkit/bin/Release/net8.0-windows/win-x64/publish/PoeToolkit.exe -DestinationPath PoeToolkit-win-x64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PoeToolkit-win-x64
          path: src/PoeToolkit/bin/Release/net8.0-windows/win-x64/publish/PoeToolkit.exe
          compression-level: 9

      - name: Create release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ steps.version.outputs.version }} PoeToolkit-win-x64.zip --title "${{ steps.version.outputs.version }}" --notes "Automated release from commit ${{ github.sha }}" --latest
